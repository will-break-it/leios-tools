# Committee arm: the CIP-0164 seat-count committee.
#
# The top `committee-seat-count` stake-holding pools are seated, ties broken
# by pool identifier ascending, and each seat votes with weight 1.  Quorum is
# `quorum-weight-fraction × seats actually filled`, so a topology with fewer
# pools than seats still certifies: the 1500-node pseudo-mainnet topology has
# 458 stake-holding nodes, so a 900-seat request seats 458 and the quorum
# denominator is 458.
#
# Layer over a scenario config, e.g.
#   sim-cli <topology> -p parameters/linear-with-tx-references.yaml \
#     -p parameters/turbo.yaml -p parameters/committee-seats.yaml
committee-selection-algorithm: "top-stake-seats"
committee-seat-count: 900
